apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hsworkshop
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OpenWebUI, Langfuse, PostgreSQL, TrustyAI guardrails
    - repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
      targetRevision: hs-hackathon
      path: module-hsworkshop/install
    # Qwen3.5 35B A3B Q4_K_M GGUF model
    - repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
      targetRevision: hs-hackathon
      path: shared-cluster/deploy-model
      helm:
        releaseName: qwen35-35b-hsworkshop
        valueFiles:
          - "qwen35-35b-a3b-hsworkshop.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: hsworkshop
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 3
