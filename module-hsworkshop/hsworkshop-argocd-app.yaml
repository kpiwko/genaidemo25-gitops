apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hsworkshop
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OpenWebUI, Langfuse, PostgreSQL, TrustyAI guardrails
    # Custom-domain overlay (chat.hsworkshop.fous.ai): adds Issuer/Certificate,
    # router RBAC, Route openwebui-custom and the OpenWebUI env patch on top of
    # install/. Activate/deactivate by pointing this path back at install/.
    - repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
      targetRevision: zijeme-it
      path: module-hsworkshop/overlays/custom-domain
    # Qwen3.6 35B A3B NVFP4 model (the only GPU model; cluster has one L40S)
    - repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
      targetRevision: zijeme-it
      path: shared-cluster/deploy-model
      helm:
        releaseName: qwen36-hsworkshop
        valueFiles:
          - "qwen36-35b-a3b-nvfp4-hsworkshop.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: hsworkshop
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 3
