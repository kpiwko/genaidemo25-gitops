apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-presets-script
  namespace: hsworkshop
data:
  setup-presets.sh: |
    #!/bin/bash
    set -e

    # Wait for OpenWebUI
    echo "Waiting for OpenWebUI to be ready..."
    until curl -sf http://openwebui:8080/health > /dev/null; do sleep 5; done

    # Login and get token
    TOKEN=$(curl -sf -X POST http://openwebui:8080/api/v1/auths/signin \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"${WEBUI_ADMIN_EMAIL}\",\"password\":\"${WEBUI_ADMIN_PASSWORD}\"}" \
      | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")

    if [ -z "$TOKEN" ]; then
      echo "ERROR: Failed to obtain auth token"
      exit 1
    fi
    echo "Authenticated successfully"

    # Wait until at least one base model is available
    echo "Waiting for base model to be available..."
    BASE_MODEL=""
    for i in $(seq 1 24); do
      BASE_MODEL=$(curl -sf http://openwebui:8080/api/models \
        -H "Authorization: Bearer $TOKEN" \
        | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    models = data.get('data', [])
    # Skip custom presets (owned_by='openai' with arena/preset markers), pick first real model
    for m in models:
        if m.get('base_model_id') is None:
            print(m['id'])
            break
    " 2>/dev/null)
      [ -n "$BASE_MODEL" ] && break
      echo "No base model yet, retrying ($i/24)..."
      sleep 10
    done

    if [ -z "$BASE_MODEL" ]; then
      echo "ERROR: No base model available after waiting"
      exit 1
    fi
    echo "Using base model: $BASE_MODEL"

    # Upsert helper: delete if exists, then create
    upsert_preset() {
      local id="$1"
      local payload="$2"
      curl -sf -X DELETE "http://openwebui:8080/api/v1/models/${id}" \
        -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
      RESULT=$(curl -sf -X POST "http://openwebui:8080/api/v1/models/" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d "$payload") || { echo "ERROR creating preset $id"; return 1; }
      echo "Preset '$id' created: $(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('name','?'))" 2>/dev/null)"
    }

    # Free Chat — no web search, no system prompt
    upsert_preset "free-chat" "{
      \"id\": \"free-chat\",
      \"name\": \"Free Chat\",
      \"base_model_id\": \"$BASE_MODEL\",
      \"params\": {},
      \"meta\": {
        \"description\": \"Open conversation with the AI assistant.\",
        \"capabilities\": {\"web_search\": false}
      }
    }"

    # Learning Path Guide — web search enabled, placeholder system prompt
    upsert_preset "learning-path-guide" "{
      \"id\": \"learning-path-guide\",
      \"name\": \"Learning Path Guide\",
      \"base_model_id\": \"$BASE_MODEL\",
      \"params\": {
        \"system\": \"You are a personalized learning path advisor. Help users build a structured, actionable learning path toward their career or technology goals. Start by asking about their current skills, experience level, target role or technology, and desired timeline. Use web search to find up-to-date learning resources, courses, and certifications. Break the path into clear milestones with concrete next steps.\"
      },
      \"meta\": {
        \"description\": \"Personalized learning path guidance with web search.\",
        \"capabilities\": {\"web_search\": true}
      }
    }"

    echo "All presets configured successfully"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-setup-presets
  namespace: hsworkshop
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: hsworkshop-anyuid
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/bash", "/scripts/setup-presets.sh"]
          env:
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_ADMIN_EMAIL
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_ADMIN_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: openwebui-presets-script
            defaultMode: 0755
