# Langfuse v3 — web (API + UI) and worker components
# v3 changed from a monolith to web + worker split
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: hsworkshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      serviceAccountName: hsworkshop-anyuid
      containers:
        - name: langfuse-web
          image: docker.io/langfuse/langfuse:4.71.0@sha256:5338ee88d4ec07028836f6af9d98a9b411f8eeda0ad9fae66502d849b04da724
          ports:
            - containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: "https://langfuse-hsworkshop.apps.kpicl2-pool-rft8p.aws.rh-ods.com"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "true"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENABLED
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse-events"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          envFrom:
            - secretRef:
                name: langfuse-secret
            # Headless init: org/project/API keys/admin user (created by apply-secrets.sh)
            - secretRef:
                name: langfuse-init-secret
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: hsworkshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      serviceAccountName: hsworkshop-anyuid
      containers:
        - name: langfuse-worker
          image: docker.io/langfuse/langfuse-worker:4.71.0@sha256:7a96801ecb291758785d68bb388b628d6cdff3ee67553c432b63244b008d4a47
          env:
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENABLED
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse-events"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          envFrom:
            - secretRef:
                name: langfuse-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: hsworkshop
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse
  namespace: hsworkshop
spec:
  host: langfuse-hsworkshop.apps.kpicl2-pool-rft8p.aws.rh-ods.com
  to:
    kind: Service
    name: langfuse
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
