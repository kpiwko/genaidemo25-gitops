# OpenWebUI PostSync preset provisioning Job (Task 5, ADR-0002).
#
# A bounded, authenticated, ADDITIVE one-shot Job that converges exactly the
# two managed workshop presets (lunch / greenhouse on qwen36-service)
# via the OpenWebUI REST API:
#   POST /api/v1/auths/signin -> GET /api/v1/models/all ->
#   POST /api/v1/models/import (changed-only, inserts carry grants) ->
#   POST /api/v1/models/model/access/update (ACL drift on existing
#   records, architect-approved pinned exception)
# It is NOT continuous database self-healing: it runs once per sync (PostSync),
# and a converged second run performs zero import and zero access POSTs
# (Task 4 semantics).
#
# The script and the sole sanitized presets input live in the content-hash
# ConfigMap `openwebui-workshop-provision` (frozen name; the generated hash
# suffix rolls on any input change), generated by the nested
# provisioning/kustomization.yaml from LOCAL files — the same
# standard-load-restrictions pattern as the Task 3 `pipelines-langfuse-filter`
# ConfigMap. Kustomize rewrites the volume reference below to the generated
# `...-<hash>` name.
#
# Security posture:
#   - Argo CD hook: PostSync with hook-delete-policy BeforeHookCreation
#     only — the previous Job object is replaced at the next sync, and the
#     LAST result (success or failure) is retained for audit.
#   - Existing `hsworkshop-anyuid` ServiceAccount with automountServiceAccountToken
#     disabled: the Job talks only to the OpenWebUI HTTP API, never to the
#     Kubernetes API — no RBAC is added for it.
#   - No PVC is mounted (the users/chats DB volume is never touched).
#   - The ConfigMap volumes are mounted readOnly; the container runs the SAME
#     pinned OpenWebUI 0.12.5 image as the Deployment (non-root by default,
#     and ConfigMap-mounted files are world-readable) with an explicit
#     `python` invocation.
#   - Credentials come from the Task 2 bootstrap Secret via env (never argv,
#     never logged; the provisioner prints counters only). Internal URL
#     http://openwebui:8080 is a documented in-cluster target for the
#     provisioner's base-URL validation.
#   - Bounded: restartPolicy Never, backoffLimit 3, activeDeadlineSeconds 600;
#     the provisioner itself bounds HTTP (10 s timeouts) and retries (3
#     reads, 3 write attempts per phase with a mandatory re-read after
#     every mutation and before any retry).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-workshop-provision
  namespace: hsworkshop
  annotations:
    # PostSync: run after the main sync resources are healthy. If the sync is
    # unhealthy for UNRELATED reasons, Argo CD blocks the hook — STOP and
    # investigate; never bypass by manual Job execution (see
    # docs/headless-openwebui.md runbook).
    argocd.argoproj.io/hook: PostSync
    # Delete a previous Job object only right before creating the new one:
    # the last result is retained between syncs for audit; no TTL/mass
    # deletion, and failed Jobs are never auto-retried by Argo CD.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: openwebui-workshop-provision
    spec:
      serviceAccountName: hsworkshop-anyuid
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: provision
          # Same pinned image as the OpenWebUI Deployment (0.12.5, commit
          # f7ac7ee…, frozen in docs/headless-openwebui.md). No upgrade, no
          # new image build — the provisioner is Python stdlib only.
          image: ghcr.io/open-webui/open-webui@sha256:0b399a8ba34558e181d316750455f2a95376a38cd60a61b9c942e138898944bd
          # Explicit interpreter invocation (never rely on the image
          # entrypoint for a Job).
          command:
            - python
            - /provision/provision_openwebui.py
          env:
            # Internal in-cluster target (documented in the provisioner's
            # base-URL allowlist: bare in-namespace service name).
            - name: OPENWEBUI_URL
              value: "http://openwebui:8080"
            # Existing-admin bootstrap credentials (Task 2 Secret; the
            # provisioner's fallback key names match these directly — no
            # OPENWEBUI_ADMIN_* overrides needed).
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openwebui-admin-bootstrap-secret
                  key: WEBUI_ADMIN_EMAIL
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openwebui-admin-bootstrap-secret
                  key: WEBUI_ADMIN_PASSWORD
            # Sole presets input: the sanitized configuration-models.json
            # from the hash ConfigMap (read-only below).
            - name: PRESETS_PATH
              value: /provision/configuration-models.json
          volumeMounts:
            - name: provision-script
              mountPath: /provision
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: provision-script
          configMap:
            name: openwebui-workshop-provision
