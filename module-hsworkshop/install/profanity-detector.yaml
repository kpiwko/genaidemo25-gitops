# Guardrails proxy for OpenWebUI → TrustyAI GuardrailsOrchestrator integration
#
# Routes /v1/chat/completions through the TrustyAI guardrails gateway.
# When the gateway blocks a prompt (UNSUITABLE_INPUT), converts the empty
# choices response into a proper assistant message so OpenWebUI shows a
# friendly bilingual message and the conversation can continue normally.
# /v1/models is forwarded directly to the predictor.
#
# Source and image build: https://github.com/kpiwko/hsworkshop-guardrails-proxy
# (async Starlette/Uvicorn proxy, native multi-arch image published by GitHub
# Actions to GHCR; pinned here by digest). Two replicas, up to 40 concurrent
# chats each (GUARDRAILS_PROXY_MAX_CHATS); overflow gets an immediate 503.
#
# Blocked requests are also tagged in Langfuse (tags: ["blocked"]) via the
# guardrails-langfuse-secret — see langfuse-proxy-secret.yaml.
#
# OpenWebUI OPENAI_API_BASE_URL: http://guardrails-proxy.hsworkshop.svc.cluster.local:8080/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-proxy
  namespace: hsworkshop
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: guardrails-proxy
  template:
    metadata:
      labels:
        app: guardrails-proxy
    spec:
      serviceAccountName: hsworkshop-anyuid
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: proxy
          image: ghcr.io/kpiwko/hsworkshop-guardrails-proxy@sha256:6911359ad1836881d46024b7618bc5c865ae466b4b5b887c1af109fab59759e5
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: guardrails-langfuse-secret
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-proxy
  namespace: hsworkshop
spec:
  selector:
    app: guardrails-proxy
  ports:
    - port: 8080
      targetPort: 8080
