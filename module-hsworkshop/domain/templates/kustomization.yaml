apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Optional chat-only custom-domain overlay.
# Generated by module-hsworkshop/domain/render.sh — do not edit rendered values
# by hand; change module-hsworkshop/domain/config.env (or env vars) and re-render.
#
# Opt-in: the Argo CD Application hsworkshop does NOT point at this overlay
# until you change its source path (see docs/custom-domain.md).
#
# Activation is TWO-PHASE (see docs/custom-domain.md "Activation"):
#   Phase 1 (certificate-only): deploy ONLY the certificate objects so the
#     Certificate becomes Ready and Secret openwebui-custom-tls exists BEFORE
#     the custom Route is admitted. Use the self-contained kustomization
#     rendered at overlays/custom-domain/certificate-only/ for that phase.
#     This full overlay is Phase 2.
#   Sync waves below order the objects so that, in Phase 2, the certificate
#     and router RBAC exist before the Route referencing the Secret.

resources:
  - ../../install
  - certificate-issuer.yaml
  - rbac-router.yaml
  - route-custom.yaml

patches:
  - path: openwebui-patch.yaml
    target:
      kind: Deployment
      name: openwebui
