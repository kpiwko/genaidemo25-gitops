model:
  name: "eurollm-22b-instruct-fp8"
  displayName: "EuroLLM 22B Instruct FP8"
  sourceUri: "oci://quay.io/dprod/eurollm-22b-instruct-fp8-modelcar:latest"
  format: "vLLM"

namespace:
  name: "hsworkshop"

runtime:
  name: "vllm-cuda-runtime-eurollm-22b-hs"
  displayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
  # Use upstream vLLM v0.18.0 for FP8 compressed-tensors support.
  # tokenizer_config.json says LlamaTokenizer (needs tokenizer.model/SentencePiece)
  # but only tokenizer.json is present. preStartScript patches tokenizer_class to
  # PreTrainedTokenizerFast so vLLM loads the fast tokenizer from tokenizer.json.
  image: "docker.io/vllm/vllm-openai:latest"
  preStartScript: >-
    while [ ! -f /mnt/models/tokenizer_config.json ]; do sleep 0.2; done;
    python3 -c 'import json; p="/mnt/models/tokenizer_config.json"; d=json.load(open(p)); d["tokenizer_class"]="PreTrainedTokenizerFast"; json.dump(d,open(p,"w")); print("Patched tokenizer_config.json",flush=True)'
  annotations:
    acceleratorName: "nvidia-gpu"
    apiProtocol: "REST"
    hardwareProfileName: ""
    recommendedAccelerators: '["nvidia.com/gpu"]'
    runtimeVersion: "latest"
    servingRuntimeScope: "global"
    templateDisplayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
    templateName: "vllm-cuda-runtime-eurollm-22b-hs"
  extraArgs:
    - --gpu-memory-utilization=0.95
    - --max-model-len=32768

inference:
  name: "eurollm-22b-service"
  displayName: "EuroLLM 22B Instruct FP8 Service"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "8"
      memory: "40Gi"
      gpu: "1"
    limits:
      cpu: "16"
      memory: "60Gi"
      gpu: "1"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

connection:
  name: ""
