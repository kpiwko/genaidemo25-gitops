model:
  name: "eurollm-22b-instruct-fp8"
  displayName: "EuroLLM 22B Instruct FP8"
  sourceUri: "oci://quay.io/dprod/eurollm-22b-instruct-fp8-modelcar:latest"
  format: "vLLM"

namespace:
  name: "hsworkshop"

runtime:
  name: "vllm-cuda-runtime-eurollm-22b-hs"
  displayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
  # rhaiis v0.13.0 used: vLLM v0.18.0 (latest) introduced a renderers module that
  # requires tokenizer.model which is absent from this modelcar (only tokenizer.json present)
  image: "registry.redhat.io/rhaiis/vllm-cuda-rhel9@sha256:ec799bb5eeb7e25b4b25a8917ab5161da6b6f1ab830cbba61bba371cffb0c34d"
  annotations:
    acceleratorName: "nvidia-gpu"
    apiProtocol: "REST"
    hardwareProfileName: ""
    recommendedAccelerators: '["nvidia.com/gpu"]'
    runtimeVersion: "v0.13.0"
    servingRuntimeScope: "global"
    templateDisplayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
    templateName: "vllm-cuda-runtime-eurollm-22b-hs"
  extraArgs:
    - --gpu-memory-utilization=0.95
    - --max-model-len=32768

inference:
  name: "eurollm-22b-service"
  displayName: "EuroLLM 22B Instruct FP8 Service"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "8"
      memory: "40Gi"
      gpu: "1"
    limits:
      cpu: "16"
      memory: "60Gi"
      gpu: "1"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

connection:
  name: ""
