model:
  name: "eurollm-22b-instruct-fp8"
  displayName: "EuroLLM 22B Instruct FP8"
  sourceUri: "oci://quay.io/dprod/eurollm-22b-instruct-fp8-modelcar:latest"
  format: "vLLM"

namespace:
  name: "hsworkshop"

runtime:
  name: "vllm-cuda-runtime-eurollm-22b-hs"
  displayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
  # Use upstream vLLM v0.18.0 for FP8 compressed-tensors support.
  # VLLM_USE_V1=0 forces the v0 engine, bypassing the renderers module that
  # requires tokenizer.model (absent from this modelcar; only tokenizer.json present).
  image: "docker.io/vllm/vllm-openai:latest"
  extraEnv:
    VLLM_USE_V1: "0"
  annotations:
    acceleratorName: "nvidia-gpu"
    apiProtocol: "REST"
    hardwareProfileName: ""
    recommendedAccelerators: '["nvidia.com/gpu"]'
    runtimeVersion: "latest"
    servingRuntimeScope: "global"
    templateDisplayName: "EuroLLM 22B Instruct FP8 vLLM Runtime"
    templateName: "vllm-cuda-runtime-eurollm-22b-hs"
  extraArgs:
    - --gpu-memory-utilization=0.95
    - --max-model-len=32768
  extraVolumes:
    - name: tokenizer-patch
      configMap:
        name: eurollm-tokenizer-patch
  extraVolumeMounts:
    - name: tokenizer-patch
      mountPath: /mnt/models/tokenizer_config.json
      subPath: tokenizer_config.json

inference:
  name: "eurollm-22b-service"
  displayName: "EuroLLM 22B Instruct FP8 Service"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "8"
      memory: "40Gi"
      gpu: "1"
    limits:
      cpu: "16"
      memory: "60Gi"
      gpu: "1"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

connection:
  name: ""
