# NOT DEPLOYED — kept for reference only; gpt-oss-20b-service is the active model in hsworkshop
model:
  name: "qwen35-35b-a3b"
  displayName: "Qwen3.5 35B A3B (Q4_K_M GGUF)"
  sourceUri: "oci://quay.io/dprod/qwen35-35b-a3b-q4km-modelcar:latest"
  format: "vLLM"
  file: "Qwen3.5-35B-A3B-Q4_K_M.gguf"

namespace:
  name: "hsworkshop"

runtime:
  name: "vllm-cuda-runtime-qwen35-gguf-hs"
  displayName: "Qwen3.5 35B A3B vLLM GGUF Runtime"
  image: "docker.io/vllm/vllm-openai:v0.18.0"
  annotations:
    acceleratorName: "nvidia-gpu"
    apiProtocol: "REST"
    hardwareProfileName: ""
    recommendedAccelerators: '["nvidia.com/gpu"]'
    runtimeVersion: "v0.18.0"
    servingRuntimeScope: "global"
    templateDisplayName: "Qwen3.5 35B A3B vLLM GGUF"
    templateName: "vllm-cuda-runtime-qwen35-gguf-hs"
  extraArgs:
    - --gpu-memory-utilization=0.90
    - --max-model-len=32768

inference:
  name: "qwen35-35b-service"
  displayName: "Qwen3.5 35B A3B Service"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "8"
      memory: "40Gi"
      gpu: "1"
    limits:
      cpu: "16"
      memory: "60Gi"
      gpu: "1"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

connection:
  name: ""
