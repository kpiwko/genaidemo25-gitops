# NOT USED in the hsworkshop rollout: the cluster has a single L40S GPU and the
# hsworkshop Application already deploys Qwen3.6 as the only GPU model.
# Apply this only on a cluster with spare GPUs (one GPU per model source).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-models
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
      targetRevision: zijeme-it
      path: shared-cluster/deploy-model
      helm:
        releaseName: gpt-oss-20b
        valueFiles:
          - "gpt-oss-20b.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "genai25-deployments"
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
