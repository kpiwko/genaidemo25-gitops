# DO NOT APPLY on clusters where RHOAI is already installed (e.g. RHOAI 3.6 EA).
# It installs Service Mesh/Serverless/RHOAI 2.x-era subscriptions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-operator
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kpiwko/genaidemo25-gitops.git
    targetRevision: zijeme-it
    path: shared-cluster/install-rhoai
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
